name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # nicegui / cdctools ne servent qu'à app.py, que les tests n'importent pas.
      - run: pip install "pulp==2.8.0" "pyyaml>=6.0" "pytest>=7.0"
      - run: python -m pytest -v
